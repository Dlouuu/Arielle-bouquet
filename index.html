<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<style>
:root{--bg:#0b0710;--fg:#f3e9f5;--card:#17101c;--accent:#ff7fb0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
#wrap{width:100%;max-width:900px;padding:8px}
canvas{width:100%;display:block}
#letter{margin:10px auto 18px;max-width:520px;width:calc(100% - 24px);background:var(--card);border:1px solid #3a2644;border-radius:14px;padding:20px 22px;font-size:18px;line-height:1.6;font-style:italic;white-space:pre-wrap;min-height:260px}
button{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:8px 18px;font:inherit;margin-bottom:28px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="letter"></div>
<button id="again">Replay ♥</button>
<script>


const NAME = "Arielle";
const FROM = "Engr. Gorospe";
const LETTER = `Dear ${NAME},

I know the flower I gave you last time has already wilted, and I couldn't bring you a fresh one this week. So I coded one for you instead. I hope it brings a smile to your face and reminds you how special you are to me.

I know today's exam was hard for you, but I want you to know I'm proud of you.

Padayon, Future Engr.!


${FROM}`;

const TAU = Math.PI * 2, cos = Math.cos, sin = Math.sin;
let seed = 7;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * cos(TAU * rnd());
const pts = [];
const P = (cx, cy, cz, r, a, dz, ch, col) => pts.push([cx + r * cos(a), cy + r * sin(a), cz + dz, ch, col]);

function hydrangea(cx, cy, cz, R = 5) {
  const cols = [75, 69, 111, 141, 147, 105];
  for (let n = 0; n < 75; n++) {
    let d;
    do { d = [gauss(), gauss(), gauss()]; const m = Math.hypot(...d) || 1; d = [d[0] / m, d[1] / m, Math.abs(d[2]) / m]; } while (d[2] < -0.2);
    const x = cx + R * d[0], y = cy + R * d[1], z = cz + R * d[2], c = cols[Math.floor(rnd() * cols.length)];
    pts.push([x, y, z, "@", c]);
    [[.8, 0], [-.8, 0], [0, .8], [0, -.8]].forEach(o => pts.push([x + o[0], y + o[1], z - .2, "o", c]));
  }
}
function sunflower(cx, cy, cz, R = 5) {
  for (let p = 0; p < 20; p++) {
    const a = TAU * p / 20;
    for (let i = 0; i < 8; i++) {
      const r = R * (0.5 + 0.5 * i / 7);
      [-0.45, 0, 0.45].forEach(s => pts.push([cx + r * cos(a) - s * sin(a), cy + r * sin(a) + s * cos(a), cz + 0.2 * i, s === 0 ? "#" : "*", p % 2 ? 220 : 214]));
    }
  }
  for (let i = 1; i < 9; i++) for (let k = 0; k < 6 * i; k++) P(cx, cy, cz, R * 0.5 * i / 8, TAU * k / (6 * i) + i, 1.5, "@%o"[i % 3], i % 2 ? 94 : 58);
}
function rose(cx, cy, cz, R = 3.6) {
  const cols = [88, 124, 160, 196, 196, 203];
  for (let k = 1; k <= 6; k++) {
    const u = k / 6, n = 5 + k * 3;
    for (let i = 0; i < n; i++) {
      const a = TAU * i / n + k * 0.8, r = R * u * (0.88 + 0.12 * cos(3 * a));
      P(cx, cy, cz, r, a, 3 * Math.pow(1 - u, 0.7), "@8Oo:."[6 - k], cols[k - 1]);
    }
  }
}
function lily(cx, cy, cz, R = 3.4) {
  const L = R * 1.6;
  for (let p = 0; p < 6; p++) {
    const a = (p * 60 + 15) * Math.PI / 180;
    for (let i = 0; i < 14; i++) {
      const t = i / 13, w = 1.1 * Math.pow(sin(Math.PI * Math.min(t * 1.15, 1)), 0.8);
      [-1, -.5, 0, .5, 1].forEach(s => pts.push([cx + t * L * cos(a) - s * w * sin(a), cy + t * L * sin(a) + s * w * cos(a), cz + 2.2 * Math.pow(1 - t, 1.2), s === 0 ? "*" : ".", s === 0 && t < .6 ? 217 : 255]));
    }
  }
  for (let p = 0; p < 6; p++) { const a = TAU * p / 6; P(cx, cy, cz, 1.0, a, 3.2, "!", 208); P(cx, cy, cz, 1.3, a, 3.6, "o", 130); }
}
function gerbera(cx, cy, cz, R = 3.4) {
  for (let p = 0; p < 28; p++) for (let i = 0; i < 7; i++) P(cx, cy, cz, R * (0.38 + 0.62 * i / 6), TAU * p / 28, 0.15 * i, i % 2 ? "=" : "-", p % 2 ? 205 : 211);
  for (let i = 1; i < 6; i++) for (let k = 0; k < 5 * i; k++) P(cx, cy, cz, 0.34 * R * i / 5, TAU * k / (5 * i), 1.3, "@:"[i % 2], i < 4 ? 52 : 226);
}
function stem(fx, fy, fz) { for (let i = 0; i <= 40; i++) { const t = i / 40; pts.push([fx * (1 - t), fy * (1 - t) - 12 * t, fz * (1 - t), "|", 34]); } }
function sprig(bx, by, bz, ex, ey, ez) {
  for (let i = 0; i <= 40; i++) {
    const t = i / 40, x = bx + (ex - bx) * t, y = by + (ey - by) * t, z = bz + (ez - bz) * t;
    pts.push([x, y, z, "/", 65]);
    if (i % 4 === 0 && i > 4) [-1, 1].forEach(s => { for (let k = 0; k < 7; k++) { const a = TAU * k / 7; pts.push([x + s * 1.5 + .9 * cos(a), y + .6 + .6 * sin(a), z, "o", s > 0 ? 108 : 71]); } });
  }
}
function wrapper() {
  for (let yy = -12; yy < -2; yy++) {
    const r = (yy + 13) * 0.9;
    for (let k = 0; k < 45; k++) {
      const t = k * 8 * Math.PI / 180;
      pts.push([r * cos(t), yy, r * sin(t), ":", 225]);
    }
  }
  for (let k = 0; k < 60; k++) {
    const t = k * 6 * Math.PI / 180;
    pts.push([2.2 * cos(t), -10, 2.2 * sin(t), "#", 197]);
  }
}

[[-13, 9, -3], [13, 9, -3], [-8, 15, -4], [8, 15, -4], [0, 17, -5]].forEach(e => sprig(0, -3, -1, ...e));
hydrangea(0, 11, -2); sunflower(-9, 8, 0); rose(9, 8, 0); lily(-4, 4, 6); gerbera(4, 4, 7); rose(0, 7, 6, 3.0);
[[0, 9, -2], [-9, 6, 0], [9, 6, 0], [-4, 2, 6], [4, 2, 7], [0, 5, 6]].forEach(f => stem(...f));
wrapper();

const H = 32;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, CX, cw, chh, dpr;
const cache = {};
function hex(c) {
  if (cache[c]) return cache[c];
  let s;
  if (c >= 232) { const g = 8 + 10 * (c - 232); s = `rgb(${g},${g},${g})`; }
  else { c -= 16; const l = [0, 95, 135, 175, 215, 255]; s = `rgb(${l[Math.floor(c / 36)]},${l[Math.floor(c / 6) % 6]},${l[c % 6]})`; }
  return (cache[c] = s);
}
function setup() {
  const wide = window.innerWidth >= 700;
  W = wide ? 80 : 64; CX = W / 2;
  const css = cv.parentElement.clientWidth - 16;
  dpr = window.devicePixelRatio || 1;
  cw = css / W; chh = cw * 2;
  cv.style.height = (H * chh) + "px";
  cv.width = css * dpr; cv.height = H * chh * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${cw * 1.65}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
}
function frame(theta) {
  const ct = cos(theta), st = sin(theta);
  const zb = new Float32Array(W * H).fill(-1e9), ch = new Array(W * H), co = new Array(W * H);
  for (const [x, y, z, c, col] of pts) {
    const xr = x * ct + z * st, zr = -x * st + z * ct;
    const sx = Math.trunc(CX + xr * 2), sy = Math.trunc(H - 3 - (y + 12));
    if (sx >= 0 && sx < W && sy >= 0 && sy < H && zr > zb[sy * W + sx]) { zb[sy * W + sx] = zr; ch[sy * W + sx] = c; co[sy * W + sx] = col; }
  }
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < W * H; i++) if (ch[i]) { ctx.fillStyle = hex(co[i]); ctx.fillText(ch[i], (i % W + 0.5) * cw, (Math.floor(i / W) + 0.5) * chh); }
}
const box = document.getElementById("letter");
let token = 0;
function type() {
  const my = ++token; let i = 0; box.textContent = "";
  (function step() { if (my !== token) return; box.textContent = LETTER.slice(0, ++i); if (i < LETTER.length) setTimeout(step, 45); })();
}
let t0 = performance.now();
function loop(now) { frame(0.6 * sin((now - t0) / 1000 * 1.5)); requestAnimationFrame(loop); }
setup(); requestAnimationFrame(loop); setTimeout(type, 2500);
window.addEventListener("resize", setup);
document.getElementById("again").onclick = () => { t0 = performance.now(); type(); };
</script>
</body>
</html>
